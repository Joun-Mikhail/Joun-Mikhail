<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Joun Mikhail — Cloud Support &amp; IT Support Engineer</title>
<desc id="desc">Animated banner: an AWS serverless topology with requests flowing from client through API Gateway and Lambda to DynamoDB, and an alarm path through CloudWatch to SNS.</desc>
<defs>
  <linearGradient id="name" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#1f2328"/><stop offset="0.55" stop-color="#0886a8"/><stop offset="1" stop-color="#6d28d9"/>
  </linearGradient>
  <radialGradient id="glowA" cx="0.18" cy="0.12" r="0.55">
    <stop offset="0" stop-color="#0886a8" stop-opacity="0.10"/><stop offset="1" stop-color="#0886a8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="0.86" cy="0.95" r="0.5">
    <stop offset="0" stop-color="#6d28d9" stop-opacity="0.10"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.1" fill="#e6eaef"/>
  </pattern>
  <linearGradient id="area" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#0886a8" stop-opacity="0.28"/><stop offset="1" stop-color="#0886a8" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="card"><rect x="1" y="1" width="1198" height="418" rx="18"/></clipPath>
  <clipPath id="spark"><rect x="724" y="292" width="412" height="64"/></clipPath>
  <path id="req" d="M780,116 L1080,116 L1080,210"/>
  <path id="alarm" d="M1080,116 C1040,168 930,158 930,210 L780,210"/>
</defs>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .up { animation: up .9s cubic-bezier(.2,.7,.2,1) both; }
  .d1 { animation-delay: .08s } .d2 { animation-delay: .18s } .d3 { animation-delay: .28s } .d4 { animation-delay: .38s } .d5 { animation-delay: .5s }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .9 } 100% { transform: scale(3.2); opacity: 0 } }
  .flow { stroke-dasharray: 4 7; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -22; } }
  .scroll { animation: scroll 9s linear infinite; }
  @keyframes scroll { to { transform: translateX(-412px); } }
  .sns { animation: flash 6s linear infinite; }
  @keyframes flash { 0%,49% { stroke: #d0d7de } 52%,64% { stroke: #cf222e } 70%,100% { stroke: #d0d7de } }
  .ping { animation: ping 6s linear infinite; }
  @keyframes ping { 0%,49% { opacity: 0 } 52%,64% { opacity: 1 } 70%,100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<g clip-path="url(#card)">
  <rect width="1200" height="420" fill="#ffffff"/>
  <rect width="1200" height="420" fill="url(#dots)"/>
  <rect width="1200" height="420" fill="url(#glowA)"/>
  <rect width="1200" height="420" fill="url(#glowB)"/>
</g>
<rect x="1" y="1" width="1198" height="418" rx="18" fill="none" stroke="#d0d7de"/>

<!-- left: identity -->
<g class="up">
  <rect x="56" y="44" width="330" height="30" rx="15" fill="#eef2f6" stroke="#d0d7de"/>
  <circle cx="76" cy="59" r="4.5" fill="#1a7f37" class="pulse"/>
  <circle cx="76" cy="59" r="4.5" fill="#1a7f37"/>
  <text x="92" y="64" class="mono" font-size="12" letter-spacing="1.4" fill="#1f2328">AVAILABLE · OPEN TO EU RELOCATION</text>
</g>
<text x="54" y="152" class="sans up d1" font-size="64" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Joun Mikhail</text>
<text x="56" y="198" class="sans up d2" font-size="25" font-weight="600" fill="#1f2328">Cloud Support Engineer  ·  IT Support Engineer</text>
<text x="56" y="236" class="mono up d3" font-size="15" fill="#0886a8">AWS serverless  /  monitoring &amp; incident response  /  automation</text>
<g class="up d4"><rect x="56" y="276" width="165" height="30" rx="15" fill="#eef2f6" stroke="#d0d7de"/><text x="71" y="296" class="sans" font-size="13" fill="#1f2328">Brno, Czech Republic</text><rect x="231" y="276" width="138" height="30" rx="15" fill="#eef2f6" stroke="#d0d7de"/><text x="246" y="296" class="sans" font-size="13" fill="#1f2328">English · Arabic</text><rect x="379" y="276" width="226" height="30" rx="15" fill="#eef2f6" stroke="#d0d7de"/><text x="394" y="296" class="sans" font-size="13" fill="#1f2328">AWS · Python · Docker · Linux</text></g>
<text x="56" y="372" class="mono up d5" font-size="14" fill="#59636e">&gt; "If it breaks at 3am, I want to know before the users do."</text>

<!-- right: live topology -->
<g class="up d2">
  <rect x="700" y="40" width="460" height="340" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="722" cy="62" r="4" fill="#cf222e" opacity=".8"/><circle cx="736" cy="62" r="4" fill="#9a6700" opacity=".8"/><circle cx="750" cy="62" r="4" fill="#1a7f37" opacity=".8"/>
  <text x="768" y="66" class="mono" font-size="11" fill="#59636e">serverless-api · request path</text>
  <text x="1140" y="66" text-anchor="end" class="mono" font-size="11" fill="#59636e">eu-central-1</text>
  <line x1="700" y1="78" x2="1160" y2="78" stroke="#d0d7de"/>

  <g fill="none" stroke="#59636e" stroke-width="1.6" stroke-opacity=".7">
    <path class="flow" d="M836,116 L874,116"/>
    <path class="flow" d="M986,116 L1024,116"/>
    <path class="flow" d="M1080,136 L1080,190"/>
    <path class="flow" d="M1040,136 C1040,168 930,158 930,190"/>
    <path class="flow" d="M874,210 L836,210"/>
  </g>

  <g fill="#0886a8">
    <circle r="4.5"><animateMotion dur="3.2s" repeatCount="indefinite" begin="0s"><mpath href="#req" xlink:href="#req"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="3.2s" repeatCount="indefinite" begin="1.07s"><mpath href="#req" xlink:href="#req"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="3.2s" repeatCount="indefinite" begin="2.13s"><mpath href="#req" xlink:href="#req"/></animateMotion></circle>
  </g>
  <circle r="5" fill="#cf222e"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#alarm" xlink:href="#alarm"/></animateMotion></circle>

  <rect x="724" y="96" width="112" height="40" rx="9" fill="#eef2f6" stroke="#d0d7de"/><rect x="736" y="112" width="8" height="8" rx="2" fill="#59636e"/><text x="752" y="121" class="sans" font-size="13" font-weight="600" fill="#1f2328">Client</text>
  <rect x="874" y="96" width="112" height="40" rx="9" fill="#eef2f6" stroke="#d0d7de"/><rect x="886" y="112" width="8" height="8" rx="2" fill="#6d28d9"/><text x="902" y="121" class="sans" font-size="13" font-weight="600" fill="#1f2328">API Gateway</text>
  <rect x="1024" y="96" width="112" height="40" rx="9" fill="#eef2f6" stroke="#d0d7de"/><rect x="1036" y="112" width="8" height="8" rx="2" fill="#9a6700"/><text x="1052" y="121" class="sans" font-size="13" font-weight="600" fill="#1f2328">Lambda</text>
  <rect x="724" y="190" width="112" height="40" rx="9" fill="#eef2f6" stroke="#d0d7de"/><rect x="736" y="206" width="8" height="8" rx="2" fill="#cf222e"/><text x="752" y="215" class="sans" font-size="13" font-weight="600" fill="#1f2328">SNS alert</text>
  <rect x="874" y="190" width="112" height="40" rx="9" fill="#eef2f6" stroke="#d0d7de"/><rect x="886" y="206" width="8" height="8" rx="2" fill="#6d28d9"/><text x="902" y="215" class="sans" font-size="13" font-weight="600" fill="#1f2328">CloudWatch</text>
  <rect x="1024" y="190" width="112" height="40" rx="9" fill="#eef2f6" stroke="#d0d7de"/><rect x="1036" y="206" width="8" height="8" rx="2" fill="#0886a8"/><text x="1052" y="215" class="sans" font-size="13" font-weight="600" fill="#1f2328">DynamoDB</text>
  <rect x="724" y="190" width="112" height="40" rx="9" fill="none" stroke-width="1.6" class="sns"/>
  <text x="780" y="248" text-anchor="middle" class="mono ping" font-size="10.5" fill="#cf222e">ALARM → on-call</text>

  <line x1="720" y1="266" x2="1140" y2="266" stroke="#d0d7de"/>
  <text x="724" y="286" class="mono" font-size="11" fill="#59636e">p95 latency</text>
  <text x="1136" y="286" text-anchor="end" class="mono" font-size="11" fill="#9a6700">- - SLO</text>
  <line x1="724" y1="312" x2="1136" y2="312" stroke="#9a6700" stroke-dasharray="3 5" stroke-opacity=".7"/>
  <g clip-path="url(#spark)">
    <g class="scroll">
      <g transform="translate(724,292)">
        <path d="M0,37.9 L12,38.4 L24,45.5 L36,41.0 L48,46.4 L60,44.5 L72,40.3 L84,43.1 L96,36.1 L108,37.8 L120,31.9 L132,30.4 L144,32.8 L156,36.7 L168,30.1 L180,32.5 L192,38.7 L204,44.3 L216,42.8 L228,42.9 L240,50.3 L252,41.4 L264,19.2 L276,5.1 L288,23.0 L300,36.9 L312,36.5 L324,39.5 L336,31.3 L348,34.4 L360,34.7 L372,32.6 L384,35.9 L396,32.9 L408,37.9 L424,38.4 L436,45.5 L448,41.0 L460,46.4 L472,44.5 L484,40.3 L496,43.1 L508,36.1 L520,37.8 L532,31.9 L544,30.4 L556,32.8 L568,36.7 L580,30.1 L592,32.5 L604,38.7 L616,44.3 L628,42.8 L640,42.9 L652,50.3 L664,41.4 L676,19.2 L688,5.1 L700,23.0 L712,36.9 L724,36.5 L736,39.5 L748,31.3 L760,34.4 L772,34.7 L784,32.6 L796,35.9 L808,32.9 L820,37.9 L824,64 L0,64 Z" fill="url(#area)"/>
        <path d="M0,37.9 L12,38.4 L24,45.5 L36,41.0 L48,46.4 L60,44.5 L72,40.3 L84,43.1 L96,36.1 L108,37.8 L120,31.9 L132,30.4 L144,32.8 L156,36.7 L168,30.1 L180,32.5 L192,38.7 L204,44.3 L216,42.8 L228,42.9 L240,50.3 L252,41.4 L264,19.2 L276,5.1 L288,23.0 L300,36.9 L312,36.5 L324,39.5 L336,31.3 L348,34.4 L360,34.7 L372,32.6 L384,35.9 L396,32.9 L408,37.9 L424,38.4 L436,45.5 L448,41.0 L460,46.4 L472,44.5 L484,40.3 L496,43.1 L508,36.1 L520,37.8 L532,31.9 L544,30.4 L556,32.8 L568,36.7 L580,30.1 L592,32.5 L604,38.7 L616,44.3 L628,42.8 L640,42.9 L652,50.3 L664,41.4 L676,19.2 L688,5.1 L700,23.0 L712,36.9 L724,36.5 L736,39.5 L748,31.3 L760,34.4 L772,34.7 L784,32.6 L796,35.9 L808,32.9 L820,37.9" fill="none" stroke="#0886a8" stroke-width="1.8" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</g>
</svg>
